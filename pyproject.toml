[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixelvault"
version = "0.1.0"
description = "Official Python SDK for PixelVault, agent-first image hosting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "PixelVault" }]
keywords = ["pixelvault", "image-hosting", "sdk", "upload", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "typing_extensions>=4.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://pixelvault.dev/docs"
Repository = "https://github.com/pixelvault-dev/sdk-python"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pixelvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src"]
